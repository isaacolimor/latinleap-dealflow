name: Backtest de la rúbrica

on:
  workflow_dispatch:   # se corre a mano: Actions → "Backtest de la rúbrica" → Run workflow

permissions:
  contents: write

concurrency:
  group: dealflow
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEALFLOW_MODEL: ${{ vars.DEALFLOW_MODEL }}
        run: python backtest.py
        timeout-minutes: 15
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "latinleap-dealflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
